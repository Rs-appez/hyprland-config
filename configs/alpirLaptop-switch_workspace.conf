# Browser workspaces
bind = , F23, workspace, name:browser2
bind = , F23, workspace, name:browser1
bind = $mainMod, ampersand, workspace, name:browser2
bind = $mainMod, ampersand, workspace, name:browser1

# Code workspaces
bind = , F22, workspace, name:code2
bind = , F22, workspace, name:code1
bind = $mainMod, eacute, workspace, name:code2
bind = $mainMod, eacute, workspace, name:code1

# Social workspaces
bind = , F21, workspace, name:social2
bind = , F21, workspace, name:social1
bind = $mainMod, quotedbl, workspace, name:social2
bind = $mainMod, quotedbl, workspace, name:social1

# Miscellaneous workspaces
bind = $mainMod, apostrophe, workspace, 4
bind = , F20, workspace, 4
bind = $mainMod, parenleft, workspace, 5
bind = , F19, workspace, 5
bind = $mainMod, minus, workspace, 6
bind = , F24, workspace, 6
bind = $mainMod, egrave, workspace, 7
bind = $mainMod, underscore, workspace, 8
bind = $mainMod, ccedilla, workspace, 9
bind = $mainMod, agrave, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, ampersand, movetoworkspace, name:browser1
bind = CTRL, F23, movetoworkspace, name:browser1
bind = $mainMod SHIFT, eacute, movetoworkspace, name:code1
bind = CTRL, F22, movetoworkspace, name:code1
bind = $mainMod SHIFT, quotedbl, movetoworkspace, name:social1
bind = CTRL, F21, movetoworkspace, name:social1
bind = $mainMod SHIFT, apostrophe, movetoworkspace, 4
bind = CTRL, F20, movetoworkspace, 4
bind = $mainMod SHIFT, parenleft, movetoworkspace, 5
bind = CTRL, F19, movetoworkspace, 5
bind = $mainMod SHIFT, minus, movetoworkspace, 6
bind = CTRL, F24, movetoworkspace, 6
bind = $mainMod SHIFT, egrave, movetoworkspace, 7
bind = $mainMod SHIFT, underscore, movetoworkspace, 8
bind = $mainMod SHIFT, ccedilla, movetoworkspace, 9
bind = $mainMod SHIFT, agrave, movetoworkspace, 10

bind = $mainMod CTRL, K, focusmonitor, $monitor2
bind = $mainMod CTRL, J, focusmonitor, $monitor1

bind = $mainMod CTRL SHIFT, K, exec, hyprctl dispatch movewindow mon:$monitor2 && hyprctl dispatch focusmonitor $monitor2
bind = $mainMod CTRL SHIFT, J, exec, hyprctl dispatch movewindow mon:$monitor1 && hyprctl dispatch focusmonitor $monitor1
